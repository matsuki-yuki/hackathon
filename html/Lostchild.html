<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>テキスト表示機能</title>
    <style>
        /* 見た目を整えるための簡単なCSS */
        body { font-family: sans-serif; }
        #displayArea {
            margin-top: 20px;
            padding: 15px;
            border: 1px solid #ccc;
            background-color: #f9f9f9;
            white-space: pre-wrap; /* 改行やスペースをそのまま表示する */
            word-wrap: break-word;   
        }
    </style>
</head>
<body>
    <h1>入力内容をページに表示</h1>

    <label for="title">タイトル:</label><br>
    <input type="text" id="title" value="今日のメモ"><br><br>
    
    <label for="content">内容:</label><br>
    <textarea id="content" rows="10" cols="50"></textarea><br><br>
    
    <button id="displayBtn">この内容で表示する</button>

    <hr>
    <h2>表示エリア</h2>
    <div id="displayArea"></div>

    <script>
        // ボタン要素を取得
        const displayBtn = document.getElementById('displayBtn');

        // ボタンがクリックされたときの処理
        displayBtn.addEventListener('click', () => {
            // 入力されたタイトルと内容を取得
            const title = document.getElementById('title').value;
            const content = document.getElementById('content').value;

            // 表示エリアの要素を取得
            const displayArea = document.getElementById('displayArea');
            
            // 表示エリアに、取得したタイトルと内容をHTMLとして書き込む
            displayArea.innerHTML = `<h3>${title}</h3><p>${content}</p>`;
        });
    </script>
</body>
</html>
